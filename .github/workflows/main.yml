name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/main.yml
      - scripts/contain_snake.py

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#bb4b4c&color_dots=#ebedf0,#d5dfe9,#adbdcf,#8198b2,#596e8c
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#bb4b4c&color_dots=#161b22,#27323e,#435367,#70839e,#a4b5cf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the snake inside the contribution grid
        run: python scripts/contain_snake.py dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg
      - name: Publish animation to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
